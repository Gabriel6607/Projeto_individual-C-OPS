<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta | C-ops Tracker</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/acesso.css"><script type="module" src="js/acesso.js"></script></head>
<body><header class="topo"><div class="largura barra"><a class="marca" href="index.html"><img src="assets/home/c-ops-tracker.svg" alt="C-ops Tracker"></a><nav class="menu" aria-label="Principal"><a href="index.html#secao-projeto">Sobre o projeto</a><a href="login.html">Entrar</a></nav></div></header>
<main class="largura acesso"><div><span class="rotulo">Seu primeiro registro</span><h1>Abra seu diário de partidas.</h1><p class="apoio">Só você acompanha seus registros. Para começar, escolha como gostaria de ser chamado.</p></div>
<section class="bloco"><h2>Criar conta</h2><form class="campos" data-acao="cadastrar"><label class="campo">Nome ou apelido<input name="nome" autocomplete="nickname" maxlength="80" required></label><label class="campo">E-mail<input name="email" type="email" autocomplete="email" maxlength="254" required></label><label class="campo">Senha (8 a 128 caracteres)<input name="senha" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label class="campo">Confirme a senha<input name="confirmacao" type="password" autocomplete="new-password" maxlength="128" required></label><button class="botao">Criar meu diário</button></form><p class="mensagem" id="mensagem" role="status"></p><p>Já tem conta? <a href="login.html">Entre aqui.</a></p></section></main></body></html>
