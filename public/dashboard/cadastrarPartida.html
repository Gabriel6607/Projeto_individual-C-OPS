<!doctype html>
<html lang="pt-BR"><head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar partidas | C-ops Tracker</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/diario.css"><script type="module" src="../js/registro.js"></script>
</head><body>
    <header class="topo" id="topo-diario"></header><main class="largura diario">
        <header class="abertura"><div><span class="rotulo">Desarmar ranqueado</span><h1>Registrar partidas</h1><p class="apoio">Agrupe as partidas do mesmo mapa e dia em um lançamento.</p></div></header>
        <p id="mensagem" class="mensagem" role="status"></p>
        <div class="colunas"><section class="bloco"><h2>Novo lançamento</h2>
            <form id="registro"><fieldset class="campos" disabled>
                <label class="campo">Data em que jogou<input type="date" name="data" min="2015-01-01" required></label>
                <label class="campo">Mapa ranqueado<select name="mapa" required><option value="">Selecione o mapa</option></select></label>
                <label class="campo">Quantidade de partidas<input type="number" name="quantidade" min="1" step="1" value="1" required></label>
                <div class="acoes"><button class="botao">Salvar lançamento</button><a id="ver-semana" href="dashboard.html">Ver meu painel</a></div>
            </fieldset></form>
        </section><aside class="bloco previa"><span class="rotulo">Prévia do registro</span><output id="estimativa" aria-live="polite">—</output><p id="calculo" class="apoio">Cada ranqueada equivale a 40 minutos estimados.</p><img id="imagem-mapa" alt="" hidden><p>Jogou em outro mapa no mesmo dia? Faça outro lançamento. O painel soma os dois no total diário.</p></aside></div>
    </main>
</body></html>
